# One module holds ~44k lines of Kotlin, and the debug build runs KSP (Hilt), the Compose compiler
# and lint in this daemon. 2g was the value inherited from the project template, not a measured
# ceiling; ubuntu-latest has 16g and the developer machines more, so give the daemon room rather
# than leave it at a limit nobody chose. Raise it further only with a measurement behind it.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Build with a JDK 21 toolchain. Gradle uses JAVA_HOME (CI sets this; locally,
# `export JAVA_HOME=".../Android Studio.app/Contents/jbr/Contents/Home"` or any JDK 21).
# Do NOT hardcode org.gradle.java.home here — a machine-specific path breaks CI and clones.

# Task-output caching. `gradle/actions/setup-gradle` already restores ~/.gradle/caches, which
# holds build-cache-1, so an unchanged task is restored instead of recompiled — across CI runs and
# between CI and the release job. Before this, every CI run reported "45 actionable tasks: 45
# executed". The release gate is unaffected: verifyDebugSigningKey declares no outputs, so it is
# never cacheable and always re-runs, and package-debug-apk.sh still verifies the built APK's
# signer with apksigner.
org.gradle.caching=true
# Skips configuration entirely when the build scripts are unchanged. Measured on this project with
# `:app:testDebugUnitTest :app:assembleDebug` and nothing to do: 13.8s before, 0.6s on a reused
# entry. Two custom tasks had to stop capturing the build script object first — see
# app/build.gradle.kts.
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official
