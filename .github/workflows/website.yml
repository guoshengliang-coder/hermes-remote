name: Website
on:
  pull_request:
    paths: ['website/**', 'release-server/src/schema.mjs', 'docs/ERROR_HANDLING.md', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', 'release-server/src/schema.mjs', 'docs/ERROR_HANDLING.md', '.github/workflows/website.yml']
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: cmp public/logo.png ../android/app/src/main/ic_launcher-playstore.png
