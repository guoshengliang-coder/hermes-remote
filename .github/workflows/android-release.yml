name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

# Publishing is deliberately separate from CI. A normal branch push cannot
# replace the public update index; only a version tag (or an explicit manual
# run on main) reaches the protected production environment below.
permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Android APK
    if: >-
      github.repository == 'guoshengliang-coder/hermes-remote' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/android-v'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mrlgs.net/releases/index.json
    # Secrets are attached to the single step that consumes them instead of the whole job, so no
    # checkout, dependency install, Gradle build, or third-party action ever sees them in its
    # environment. Third-party actions are pinned to full commit SHAs for the same reason.
    steps:
      - name: Check release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF_NAME" == "main" ]] || {
              echo "Manual publishing is allowed only from main (got $GITHUB_REF_NAME)." >&2
              exit 1
            }
          fi

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify tag matches app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("android/app/build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'^val\s+appVersionName\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if not match:
              raise SystemExit("appVersionName is missing")
          print(match.group(1))
          PY
          )"
          [[ "$GITHUB_REF_NAME" == "android-v$app_version" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match appVersionName $app_version." >&2
            exit 1
          }

      - name: Verify source is the pushed main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "The release ref must point at the current origin/main commit." >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Run Node build and test gate
        run: |
          npm ci --ignore-scripts
          npm run test:ci

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      # The release build does not reuse CI's task outputs, and cannot. This job injects
      # MISSIONGO_ENDPOINT and MISSIONGO_SDK_TOKEN into BuildConfig (app/build.gradle.kts), and
      # ordinary CI deliberately carries neither. A different BuildConfig is a different input to
      # every compilation downstream of it, so the build cache has nothing to offer: the 0.1.116
      # release logged "55 actionable tasks: 55 executed". Its Gradle User Home entry is its own as
      # well — setup-gradle prefers an entry saved by an earlier run of this same job on main (a
      # workflow_dispatch) over the environment-wide fallback that would reach ci.yml's entries.
      # verifyDebugSigningKey declares no outputs, so it is never cacheable and always executes, and
      # package-debug-apk.sh independently re-reads the built APK's signer, package, and version
      # with aapt/apksigner.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Without a key, setup-gradle stores the configuration-cache entry and throws it away:
          # "Configuration-cache data will not be saved/restored without an encryption key being
          # provided." In this job it rarely pays off: every release edits app/build.gradle.kts,
          # which invalidates the entry, and the MISSIONGO_* values read at configuration time
          # differ from CI's. It stays so all three setup-gradle steps are identical and tested alike.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build signed APK and erase signing key
        shell: bash
        env:
          HERMES_DEBUG_KEYSTORE_BASE64: ${{ secrets.HERMES_DEBUG_KEYSTORE_BASE64 }}
          # The in-app feedback entry only exists when the build carries these. They reach a local
          # build through the gitignored android/missiongo.properties, which a runner never has, so
          # without them a released APK would silently ship without the feature. Ordinary CI is
          # deliberately left without them and exercises the not-configured path instead.
          MISSIONGO_ENDPOINT: ${{ secrets.MISSIONGO_ENDPOINT }}
          MISSIONGO_SDK_TOKEN: ${{ secrets.MISSIONGO_SDK_TOKEN }}
        run: |
          set -euo pipefail
          key="$HOME/.android/debug.keystore"
          trap 'rm -f "$key"' EXIT
          [[ -n "${HERMES_DEBUG_KEYSTORE_BASE64:-}" ]] || {
            echo "Missing HERMES_DEBUG_KEYSTORE_BASE64 repository secret." >&2
            exit 1
          }
          mkdir -p "$HOME/.android"
          printf '%s' "$HERMES_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          APK_REQUIRE_MISSIONGO_CONFIG=1 \
            APK_RELEASE_METADATA_FILE="$RUNNER_TEMP/apk-release-gate.json" \
            ./scripts/package-debug-apk.sh

      - name: Publish APK and erase deployment key
        shell: bash
        env:
          RELEASE_SSH_PRIVATE_KEY: ${{ secrets.RELEASE_SSH_PRIVATE_KEY }}
          RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.RELEASE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key="$HOME/.ssh/id_ed25519"
          known_hosts="$HOME/.ssh/known_hosts"
          gate="$RUNNER_TEMP/apk-release-gate.json"
          trap 'rm -f "$key" "$known_hosts" "$gate"' EXIT
          [[ -n "${RELEASE_SSH_PRIVATE_KEY:-}" ]] || {
            echo "Missing RELEASE_SSH_PRIVATE_KEY repository secret." >&2
            exit 1
          }
          [[ -n "${RELEASE_SSH_KNOWN_HOSTS:-}" ]] || {
            echo "Missing RELEASE_SSH_KNOWN_HOSTS repository secret." >&2
            exit 1
          }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RELEASE_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$RELEASE_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          APK_RELEASE_GATE_FILE="$gate" ./scripts/publish-android-apk.sh
