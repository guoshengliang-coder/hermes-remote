name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

# Publishing is deliberately separate from CI. A normal branch push cannot
# replace the public update index; only a version tag (or an explicit manual
# run on main) reaches the protected production environment below.
permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Android APK
    if: >-
      github.repository == 'guoshengliang-coder/hermes-remote' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/android-v'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mrlgs.net/releases/index.json
    env:
      HERMES_DEBUG_KEYSTORE_BASE64: ${{ secrets.HERMES_DEBUG_KEYSTORE_BASE64 }}
      RELEASE_SSH_PRIVATE_KEY: ${{ secrets.RELEASE_SSH_PRIVATE_KEY }}
      RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.RELEASE_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF_NAME" == "main" ]] || {
              echo "Manual publishing is allowed only from main (got $GITHUB_REF_NAME)." >&2
              exit 1
            }
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("android/app/build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'^val\s+appVersionName\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if not match:
              raise SystemExit("appVersionName is missing")
          print(match.group(1))
          PY
          )"
          [[ "$GITHUB_REF_NAME" == "android-v$app_version" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match appVersionName $app_version." >&2
            exit 1
          }

      - name: Verify source is the pushed main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "The release ref must point at the current origin/main commit." >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run protocol checks
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provision canonical debug signing key
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HERMES_DEBUG_KEYSTORE_BASE64:-}" ]] || {
            echo "Missing HERMES_DEBUG_KEYSTORE_BASE64 repository secret." >&2
            exit 1
          }
          mkdir -p "$HOME/.android"
          printf '%s' "$HERMES_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Configure SSH deployment key
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RELEASE_SSH_PRIVATE_KEY:-}" ]] || {
            echo "Missing RELEASE_SSH_PRIVATE_KEY repository secret." >&2
            exit 1
          }
          [[ -n "${RELEASE_SSH_KNOWN_HOSTS:-}" ]] || {
            echo "Missing RELEASE_SSH_KNOWN_HOSTS repository secret." >&2
            exit 1
          }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RELEASE_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$RELEASE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Publish APK and verify public index
        run: ./scripts/publish-android-apk.sh
