name: Android diagnostic proof
on:
  push:
    branches: [codex/android-ci-diagnostics]
    paths: [.github/workflows/android-diagnostic-proof.yml]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Compile isolated synthetic worker
        run: |
          mkdir -p "$RUNNER_TEMP/proof-classes"
          cat > "$RUNNER_TEMP/Probe.java" <<'JAVA'
          public class Probe {
            public static void main(String[] args) throws Exception {
              Thread.currentThread().setName("synthetic-private-thread-token");
              while (true) Thread.sleep(100);
            }
          }
          JAVA
          javac --release 17 -d "$RUNNER_TEMP/proof-classes" android/test-watchdog/src/com/hermes/testing/*.java "$RUNNER_TEMP/Probe.java"
          printf 'Premain-Class: com.hermes.testing.TestWorkerWatchdog\n' > "$RUNNER_TEMP/proof-manifest"
          jar cfm "$RUNNER_TEMP/proof.jar" "$RUNNER_TEMP/proof-manifest" -C "$RUNNER_TEMP/proof-classes" .
      - name: Expect watchdog to stop this synthetic worker
        id: timeout
        continue-on-error: true
        run: java "-Dhermes.test.diagnostics.dir=$RUNNER_TEMP/diagnostic-proof" "-javaagent:$RUNNER_TEMP/proof.jar=6" -cp "$RUNNER_TEMP/proof-classes" Probe > "$RUNNER_TEMP/proof-process.log" 2>&1
      - name: Assert expected failure and sanitized evidence
        if: always()
        env:
          EXPECTED_OUTCOME: ${{ steps.timeout.outcome }}
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);output=root/'diagnostic-proof'
          assert os.environ['EXPECTED_OUTCOME']=='failure'
          assert 'HR-TEST-001' in (root/'proof-process.log').read_text()
          files=list(output.glob('*.threads.txt'));assert files
          text='\n'.join(file.read_text() for file in files)
          assert 'Probe.main(Probe.java:' in text and 'java.lang.Thread.State:' in text
          frames=sum(line.startswith('at ') for line in text.splitlines())
          assert frames>10 and 'java.lang.Thread.sleep0(java.base@' in text
          assert 'synthetic-private-thread-token' not in text and str(root) not in text
          (output/'summary.json').write_text(json.dumps({'code':'HR-TEST-001','fixture':'synthetic',
            'expectedOutcome':'failure','workerStopped':True,'snapshots':len(files),
            'sanitized':True,'frames':frames,'timeoutSeconds':6},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-diagnostic-proof
          path: |
            ${{ runner.temp }}/diagnostic-proof/*.txt
            ${{ runner.temp }}/diagnostic-proof/summary.json
          retention-days: 7
          if-no-files-found: error
