name: Android SDK cache probe
on:
  push:
    branches: [codex/android-cache-bootstrap]
    paths: [.github/workflows/android-sdk-cache-probe.yml]
permissions:
  contents: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: false
      - name: Inspect restored configuration without executing tasks
        env:
          HERMES_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/android-test-diagnostics
          PROBE_OUTPUT: ${{ runner.temp }}/sdk-cache-probe
        run: |
          python3 -B - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          output=Path(os.environ['PROBE_OUTPUT']);output.mkdir()
          modules=Path(os.environ['GRADLE_USER_HOME'])/'caches/modules-2/files-2.1'
          jars=[]
          for group,artifact,version in [('com.android.tools','common','32.1.1'),('org.jetbrains.kotlin','kotlin-stdlib','2.3.10'),('com.google.guava','guava','*')]:
            jars.extend((modules/group/artifact).glob(version+'/*/*.jar'))
          cp=os.pathsep.join(map(str,jars))
          source=output/'SdkCacheLocation.java'
          source.write_text('import com.android.prefs.AndroidLocationsSingleton; public class SdkCacheLocation { public static void main(String[] args) { System.out.println(AndroidLocationsSingleton.INSTANCE.computeAndroidFolder().resolve("cache")); } }\n')
          subprocess.run(['javac','-cp',cp,'-d',str(output),str(source)],check=True)
          cache=Path(subprocess.check_output(['java','-cp',str(output)+os.pathsep+cp,'SdkCacheLocation'],text=True).strip())
          assert cache.name=='cache' and cache.resolve().is_relative_to(Path.home())
          result={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'initialSdkCacheExists':cache.exists(),'phases':[]}
          for phase in ('fresh','sdk-initialized','same-runner'):
            if phase=='sdk-initialized':cache.mkdir(parents=True,exist_ok=True)
            start=time.monotonic()
            with (output/(phase+'.log')).open('w') as log:
              proc=subprocess.run(['./gradlew',':app:testDebugUnitTest','--no-daemon','--console=plain','--dry-run'],cwd='android',stdout=log,stderr=subprocess.STDOUT,timeout=300)
            text=(output/(phase+'.log')).read_text()
            if proc.returncode:raise SystemExit('HR-CI-001: 构建对比测试未完成，请查看测试日志并修正后重试。 / The build comparison did not complete. Review the test logs, fix the cause and retry.')
            row={'phase':phase,'elapsedSeconds':time.monotonic()-start,'configurationCacheReused':'Reusing configuration cache.' in text,'sdkCacheExistsAfter':cache.exists(),
                 'sdkDirectoryInvalidation':("cache' has been created." in text),'dryRunTasks':sum(line.endswith(' SKIPPED') for line in text.splitlines())}
            assert row['dryRunTasks']>0
            result['phases'].append(row)
            (output/'results.json').write_text(json.dumps(result,indent=2)+'\n')
            print(json.dumps(row),flush=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sdk-cache-probe-${{ matrix.sample }}
          path: |
            ${{ runner.temp }}/sdk-cache-probe/*.log
            ${{ runner.temp }}/sdk-cache-probe/results.json
          retention-days: 7
          if-no-files-found: error
