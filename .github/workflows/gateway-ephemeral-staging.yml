name: Gateway Ephemeral Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-r3-ephemeral-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install isolated-host dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes nginx openssl
      - name: Build and exercise the R3 staging path
        run: ./scripts/test-gateway-staging-bootstrap.sh
