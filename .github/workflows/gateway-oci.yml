name: Gateway OCI

on:
  pull_request:
    paths:
      - ".github/workflows/gateway-oci.yml"
      - ".dockerignore"
      - "connector/**"
      - "deploy/Dockerfile.gateway"
      - "gateway/**"
      - "package.json"
      - "package-lock.json"
      - "protocol/**"
      - "ops/**"
      - "scripts/hermesctl.mjs"
      - "scripts/package-gateway-bundle.sh"
      - "scripts/package-gateway-image.sh"
      - "scripts/inspect-gateway-archive-identity.mjs"
      - "scripts/lib/gateway-archive-identity.mjs"
      - "scripts/lib/gateway-candidate-smoke.mjs"
      - "scripts/package-production-baseline-bundle.mjs"
      - "scripts/production-baseline.mjs"
      - "scripts/smoke-compat-client.mjs"
      - "scripts/write-gateway-bundle-manifest.mjs"
      - "scripts/test-gateway-image.sh"
      - "scripts/verify-gateway-image-candidate.mjs"
      - "scripts/verify-production-baseline-bundle.mjs"
      - "scripts/lib/release-errors.mjs"
      - "scripts/report-release-error.mjs"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/gateway-oci.yml"
      - ".dockerignore"
      - "connector/**"
      - "deploy/Dockerfile.gateway"
      - "gateway/**"
      - "package.json"
      - "package-lock.json"
      - "protocol/**"
      - "ops/**"
      - "scripts/hermesctl.mjs"
      - "scripts/package-gateway-bundle.sh"
      - "scripts/package-gateway-image.sh"
      - "scripts/inspect-gateway-archive-identity.mjs"
      - "scripts/lib/gateway-archive-identity.mjs"
      - "scripts/lib/gateway-candidate-smoke.mjs"
      - "scripts/package-production-baseline-bundle.mjs"
      - "scripts/production-baseline.mjs"
      - "scripts/smoke-compat-client.mjs"
      - "scripts/write-gateway-bundle-manifest.mjs"
      - "scripts/test-gateway-image.sh"
      - "scripts/verify-gateway-image-candidate.mjs"
      - "scripts/verify-production-baseline-bundle.mjs"
      - "scripts/lib/release-errors.mjs"
      - "scripts/report-release-error.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-oci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Build and smoke the exact Gateway image
        run: ./scripts/test-gateway-image.sh
      - name: Package the immutable staging bundle
        run: ./scripts/package-gateway-bundle.sh outputs/gateway-bundle
      - name: Package the production-baseline operator bundle
        run: node scripts/package-production-baseline-bundle.mjs outputs/production-baseline-bundle
      - name: Retain the main candidate for production audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-bundle-${{ github.sha }}
          path: |
            outputs/gateway-bundle/
            outputs/production-baseline-bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
