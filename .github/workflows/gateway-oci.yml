name: Gateway OCI

on:
  pull_request:
    paths:
      - ".github/workflows/gateway-oci.yml"
      - ".dockerignore"
      - "connector/**"
      - "deploy/Dockerfile.gateway"
      - "gateway/**"
      - "package.json"
      - "package-lock.json"
      - "protocol/**"
      - "ops/**"
      - "scripts/hermesctl.mjs"
      - "scripts/package-gateway-bundle.sh"
      - "scripts/package-gateway-image.sh"
      - "scripts/write-gateway-bundle-manifest.mjs"
      - "scripts/test-gateway-image.sh"
      - "scripts/verify-gateway-image-candidate.mjs"
      - "scripts/lib/release-errors.mjs"
      - "scripts/report-release-error.mjs"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/gateway-oci.yml"
      - ".dockerignore"
      - "connector/**"
      - "deploy/Dockerfile.gateway"
      - "gateway/**"
      - "package.json"
      - "package-lock.json"
      - "protocol/**"
      - "ops/**"
      - "scripts/hermesctl.mjs"
      - "scripts/package-gateway-bundle.sh"
      - "scripts/package-gateway-image.sh"
      - "scripts/write-gateway-bundle-manifest.mjs"
      - "scripts/test-gateway-image.sh"
      - "scripts/verify-gateway-image-candidate.mjs"
      - "scripts/lib/release-errors.mjs"
      - "scripts/report-release-error.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Build and smoke the exact Gateway image
        run: ./scripts/test-gateway-image.sh
      - name: Package the immutable staging bundle
        run: ./scripts/package-gateway-bundle.sh outputs/gateway-bundle
