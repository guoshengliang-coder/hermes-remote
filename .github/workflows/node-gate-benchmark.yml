name: Node gate benchmark

# Temporary pre-merge experiment: no main trigger or protected release environment.
on:
  push:
    branches: [codex/github-flow-preflight]
    paths:
      - .github/workflows/node-gate-benchmark.yml
      - scripts/ci/benchmark-node-gate.py

permissions:
  contents: read

concurrency:
  group: node-gate-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Select the same prerequisites as macOS component candidates
        run: |
          set -euo pipefail
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          openssl_bin="$(brew --prefix openssl@3)/bin"
          "$openssl_bin/openssl" version | grep '^OpenSSL 3\.'
          printf '%s\n' "$openssl_bin" >> "$GITHUB_PATH"
          printf 'TMPDIR=%s\n' "$(cd "$TMPDIR" && pwd -P)" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - name: Compare six samples on this runner
        env:
          BENCHMARK_OUTPUT_DIR: ${{ runner.temp }}/node-gate-benchmark
        run: python3 scripts/ci/benchmark-node-gate.py
      - name: Retain measurements and test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-gate-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/node-gate-benchmark/
          if-no-files-found: warn
          retention-days: 7
