name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Ordinary CI is deliberately unprivileged: it never receives the canonical debug signing key or any
# release secret, so it must only run checks that work without signing material.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.filter.outputs.node }}
      android: ${{ steps.filter.outputs.android }}
      desktop: ${{ steps.filter.outputs.desktop }}
      assets: ${{ steps.filter.outputs.assets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: filter
        name: Select affected component jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/changed-components.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify shared app icon
        if: steps.filter.outputs.assets == 'true'
        run: cmp android/app/src/main/ic_launcher-playstore.png desktop/Packaging/AppIcon.png

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: hermes_test
          POSTGRES_USER: hermes_test
          POSTGRES_PASSWORD: hermes_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes_test -d hermes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCOUNT_TEST_DATABASE_URL: postgresql://hermes_test:hermes_test_password@127.0.0.1:5432/hermes_test
      RUN_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:ci

  # assembleDebug depends on verifyDebugSigningKey and fails closed without the shared debug
  # keystore (docs/SIGNING.md), which CI must never hold. Unit tests and lint cover the same code
  # without packaging or signing an APK; producing a distributable artifact stays exclusive to
  # android-release.yml.
  #
  # Tests and lint are separate jobs: lint ran last in a single five-minute task graph and nothing
  # waits on its result, so on GitHub — where every job gets its own runner — moving it off the
  # critical path costs nothing but a second checkout. `:app:compileDebugSources` used to run
  # alongside them for "full source compilation" coverage; it is a lifecycle task that adds no work
  # of its own (`:app:testDebugUnitTest --dry-run` already resolves the entire debug main
  # compilation, and adding it to that command contributes exactly one SKIPPED node), so it is
  # gone. Both jobs compile the module, and both restore that compilation from the Gradle build
  # cache that the main-branch run writes — see android/gradle.properties.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Without a key, setup-gradle stores the configuration-cache entry and throws it away:
          # "Configuration-cache data will not be saved/restored without an encryption key being
          # provided." Before the key existed every run logged "Configuration cache entry stored";
          # with it, runs log "Reusing configuration cache." — except the first run after a change
          # to app/build.gradle.kts, which every release makes. An absent secret is not a failure.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: ./gradlew :app:testDebugUnitTest --no-daemon

  android-lint:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Without a key, setup-gradle stores the configuration-cache entry and throws it away:
          # "Configuration-cache data will not be saved/restored without an encryption key being
          # provided." Before the key existed every run logged "Configuration cache entry stored";
          # with it, runs log "Reusing configuration cache." — except the first run after a change
          # to app/build.gradle.kts, which every release makes. An absent secret is not a failure.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: ./gradlew :app:lintDebug --no-daemon

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm run desktop:test
      - run: npm run desktop:app

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
