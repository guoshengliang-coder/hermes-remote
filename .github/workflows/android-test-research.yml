name: Android test research

on:
  push:
    branches: [codex/android-test-research]
    paths:
      - .github/workflows/android-test-research.yml
      - scripts/ci/benchmark-android-tests.py

permissions:
  contents: read

concurrency:
  group: android-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true
          build-scan-publish: false
      - name: Measure identical full tests on one runner
        env:
          BENCHMARK_OUTPUT_DIR: ${{ runner.temp }}/android-test-research
        run: python3 -B scripts/ci/benchmark-android-tests.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-test-research
          path: ${{ runner.temp }}/android-test-research
          if-no-files-found: error
          retention-days: 7
