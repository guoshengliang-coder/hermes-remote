name: SAST

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: sast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Semgrep Community Edition 1.176.0, pinned to the official multi-arch image digest.
      image: semgrep/semgrep:1.176.0@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
      options: --security-opt=no-new-privileges
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run Semgrep Community Edition
        env:
          SEMGREP_SEND_METRICS: "off"
        # docs/design/stitch/*.html are verbatim Stitch exports, pinned by sha256 in
        # stitch.lock.json and never served to anyone: they are opened from file:// by
        # scripts/design/stitch-render.sh to produce reference PNGs. They load Tailwind and
        # Google Fonts from a CDN without an `integrity` attribute, which trips
        # html.security.audit.missing-integrity six times. Adding the attribute is not an
        # option — the whole point of these files is that they are byte-identical to what
        # Stitch produced, so editing them breaks the hash that detects design changes.
        # Residual risk accepted: a compromised CDN could run script inside the headless
        # Chrome that renders them locally. Narrow exclusion rather than a .semgrepignore,
        # which would replace semgrep's built-in ignore set (225 files on the last run).
        run: >-
          semgrep scan
          --config p/default
          --error
          --metrics off
          --timeout 60
          --max-target-bytes 1000000
          --exclude 'docs/design/stitch/*.html'
          .
