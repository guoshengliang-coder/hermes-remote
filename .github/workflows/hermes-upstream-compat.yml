name: Hermes upstream compatibility
on:
  pull_request:
    paths:
      - 'scripts/compat/**'
      - 'protocol/fixtures/**'
      - 'docs/hermes-rpc-params.json'
      - 'connector/src/hermes-*.ts'
      - 'desktop/Sources/HermesGoDesktopCore/Resources/hermes-upgrade-worker.py'
      - '.github/workflows/hermes-upstream-compat.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
jobs:
  verified-source-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: 17b5df02f2a729d8f46fbbf78cfc1f5a8cf0f121
          path: .upstream/current
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: 818c13be1dc4fd28987e1e881a9408224afd4535
          path: .upstream/candidate
          persist-credentials: false
      - name: Install isolated database test dependencies
        run: python -m pip install -r scripts/compat/requirements.txt
      - name: Test source checker failure cases
        run: python -I -B -m unittest discover -s scripts/compat -p 'test_*.py'
      - name: Check pinned source contracts and synthetic history recovery
        run: python -I -B scripts/compat/hermes-matrix.py --old-root .upstream/current --candidate-root .upstream/candidate
      - name: Check that process retirement is not global writer exclusion
        run: python -I -S -B scripts/compat/hermes-maintenance-scope.py --old-root .upstream/current --candidate-root .upstream/candidate
      - name: Exercise isolated proposed maintenance lease with frozen retirement module
        run: python -I -S -B scripts/compat/hermes-maintenance-prototype.py --candidate-root .upstream/candidate
      - name: Exercise admission placement before real CLI bootstrap imports
        run: python -I -S -B scripts/compat/hermes-maintenance-entry.py --candidate-root .upstream/candidate
      - name: Exercise shared bootstrap entry guards and inherited exclusive recovery role
        run: python -I -S -B scripts/compat/hermes-maintenance-bootstrap.py --candidate-root .upstream/candidate
      - name: Exercise live bound maintenance handoff before copied source imports
        run: python -I -S -B scripts/compat/hermes-maintenance-handoff.py --candidate-root .upstream/candidate
      - name: Exercise uncertain commits and synthetic handoff process death
        run: python -I -S -B scripts/compat/hermes-maintenance-failures.py --candidate-root .upstream/candidate
      - name: Exercise persisted intent admission after publisher death
        run: python -I -S -B scripts/compat/hermes-maintenance-durable.py --candidate-root .upstream/candidate
      - name: Check real upstream checkout lock and surviving child custody
        run: python -I -B scripts/compat/hermes-update-lock-matrix.py --candidate-root .upstream/candidate
  upstream-lock-matrix-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: 818c13be1dc4fd28987e1e881a9408224afd4535
          path: .upstream/candidate
          persist-credentials: false
      - name: Check real upstream checkout lock and surviving child custody on macOS
        run: python -I -B scripts/compat/hermes-update-lock-matrix.py --candidate-root .upstream/candidate
      - name: Exercise proposed maintenance lease and inherited child custody on macOS
        run: |
          python -I -S -B -m unittest discover -s scripts/compat -p 'test_hermes_maintenance_prototype.py'
          python -I -S -B scripts/compat/hermes-maintenance-prototype.py --candidate-root .upstream/candidate
          python -I -S -B -m unittest discover -s scripts/compat -p 'test_hermes_maintenance_entry.py'
          python -I -S -B scripts/compat/hermes-maintenance-entry.py --candidate-root .upstream/candidate
          python -I -S -B -m unittest discover -s scripts/compat -p 'test_hermes_maintenance_bootstrap.py'
          python -I -S -B scripts/compat/hermes-maintenance-bootstrap.py --candidate-root .upstream/candidate
          python -I -S -B -m unittest discover -s scripts/compat -p 'test_hermes_maintenance_handoff.py'
          python -I -S -B scripts/compat/hermes-maintenance-handoff.py --candidate-root .upstream/candidate
          python -I -S -B -m unittest discover -s scripts/compat -p 'test_hermes_maintenance_failures.py'
          python -I -S -B scripts/compat/hermes-maintenance-failures.py --candidate-root .upstream/candidate
          python -I -S -B -m unittest discover -s scripts/compat -p 'test_hermes_maintenance_durable.py'
          python -I -S -B scripts/compat/hermes-maintenance-durable.py --candidate-root .upstream/candidate
  upstream-main-warning:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: 17b5df02f2a729d8f46fbbf78cfc1f5a8cf0f121
          path: .upstream/current
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: .upstream/main
          persist-credentials: false
      - name: Read-only main source warning (does not certify an upgrade)
        run: python -I -B scripts/compat/hermes-matrix.py --old-root .upstream/current --candidate-root .upstream/main --source-only
