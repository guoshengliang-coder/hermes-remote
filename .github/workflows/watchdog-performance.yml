name: Watchdog performance
on:
  push:
    branches: [codex/android-cache-bootstrap]
    paths: [.github/workflows/watchdog-performance.yml]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Compare complete serial and parallel safety suites
        env:
          BENCHMARK_OUTPUT_DIR: ${{ runner.temp }}/watchdog-performance
        run: |
          python3 -B - <<'PY'
          import json,os,re,subprocess,sys,time
          from pathlib import Path
          sys.path.insert(0,'android/test-watchdog');import run_tests
          output=Path(os.environ['BENCHMARK_OUTPUT_DIR']);output.mkdir()
          expected=sorted(run_tests.discover_cases())
          result={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'cpus':len(os.sched_getaffinity(0)),'cases':expected,'samples':[]}
          try:
            for i,variant in enumerate(('serial','parallel','parallel','serial','serial','parallel'),1):
              command=['python3','-B','android/test-watchdog/test_watchdog.py','-v'] if variant=='serial' else ['python3','-B','android/test-watchdog/run_tests.py']
              start=time.monotonic()
              with (output/f'{i}-{variant}.log').open('w') as log:
                proc=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=120)
              elapsed=time.monotonic()-start
              text=(output/f'{i}-{variant}.log').read_text()
              if proc.returncode:raise ValueError('suite_failed')
              seen=[]
              for method,owner in re.findall(r'^(test\w+) \((?:__main__|test_watchdog)\.([\w.]+)\) \.\.\. ok$',text,re.MULTILINE):
                seen.append(owner.removesuffix('.'+method)+'.'+method)
              if sorted(seen)!=expected:raise ValueError('case_set_changed')
              if variant=='serial':
                if not re.search(rf'^Ran {len(expected)} tests in ',text,re.MULTILINE) or not re.search(r'^OK$',text,re.MULTILINE):raise ValueError('incomplete_serial')
              else:
                lines=[line.split(' ',1)[1] for line in text.splitlines() if line.startswith('WATCHDOG_RESULTS ')]
                if len(lines)!=1:raise ValueError('missing_parallel_summary')
                parsed=json.loads(lines[0])
                if parsed['total']!=len(expected) or parsed['passed']!=len(expected) or sorted(parsed['cases'])!=expected:raise ValueError('incomplete_parallel')
              row={'variant':variant,'elapsedSeconds':elapsed,'cases':len(seen),'returncode':proc.returncode}
              result['samples'].append(row)
              (output/'results.json').write_text(json.dumps(result,indent=2)+'\n')
              print('WATCHDOG_SAMPLE '+json.dumps(row),flush=True)
          except Exception:
            print('HR-CI-001: 构建对比测试未完成，请查看测试日志并修正后重试。 / The build comparison did not complete. Review the test logs, fix the cause and retry.',file=sys.stderr)
            sys.exit(1)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: watchdog-performance
          path: ${{ runner.temp }}/watchdog-performance/
          retention-days: 7
          if-no-files-found: error
