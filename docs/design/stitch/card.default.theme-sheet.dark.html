<body class="bg-obsidian-dim flex items-center justify-center min-h-screen p-0 md:p-6 select-none">

      <!-- Drag Handle -->
      <div class="pt-3 pb-1.5 flex justify-center w-full cursor-grab">
        <div class="w-9 h-1.5 bg-outline-dark-variant rounded-full"></div>
      </div>

      <!-- Theme Options List in Dark Mode -->

      <!-- Action & Tip Footer -->

        <button class="w-full h-12 bg-ink-dark hover:bg-white text-obsidian font-semibold text-sm rounded-xl transition-all shadow-md active:scale-[0.99] flex items-center justify-center space-x-2 cursor-pointer"><span class="tracking-wide">完成</span></button>

      <div class="h-6 w-full flex justify-center items-center pb-2">
        <div class="w-32 h-1 bg-ink-dark/25 rounded-full"></div>
      </div>
    </div>
