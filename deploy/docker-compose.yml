services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      PORT: "8787"
      APP_TOKEN: "${APP_TOKEN}"
      CONNECTOR_TOKEN: "${CONNECTOR_TOKEN}"
      LIFECYCLE_EVENT_STORE_FILE: "/var/lib/hermes-remote/lifecycle-events.json"
    volumes:
      - hermes_gateway_data:/var/lib/hermes-remote
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hermes_gateway_data:
